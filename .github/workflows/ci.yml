name: Basic checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "src/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "src/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run basic checks
        run: npm test
